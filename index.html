<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>围棋对战</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><h1>围棋对战平台</h1><section class="panel" id="identity"><h2>登录</h2><label>昵称 <input id="nickname" maxlength="30" placeholder="输入昵称"></label><button id="sign-in">开始</button><span id="connection-status">未连接</span></section><section class="panel" id="lobby" hidden><h2>招募房间</h2><form id="create-room-form"><input id="room-title" maxlength="80" placeholder="房间标题" required><input id="room-introduction" maxlength="500" placeholder="招募介绍"><select id="board-size"><option value="19">19 路</option><option value="13">13 路</option><option value="9">9 路</option></select><input id="game-minutes" type="number" min="1" max="180" value="20" aria-label="总分钟"><input id="move-seconds" type="number" min="5" max="600" value="30" aria-label="每手秒数"><button>创建房间</button></form><p id="lobby-status"></p><div id="room-list"></div></section><section class="panel" id="owner-applications" hidden><h2>待处理申请</h2><div id="applications"></div></section><section class="panel game-info"><p id="mode-label">当前模式：大厅</p><p id="timers">总时间：--:-- ｜ 当前手剩余：--:--</p><p id="status">登录后可创建或申请房间。</p><div class="buttons"><button id="pass">停一手</button></div></section><section class="board-wrap"><canvas id="board" width="760" height="760" aria-label="围棋棋盘"></canvas></section></main><script src="app.js"></script></body></html>
