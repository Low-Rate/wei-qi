<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>围棋对战</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>围棋对战平台</h1>
      <section class="panel modes">
        <h2>选择模式</h2>
        <div class="buttons">
          <button id="mode-ai">人机对决</button>
          <button id="mode-local">本机双人</button>
          <button id="mode-room-host">创建房间</button>
          <button id="mode-room-join">加入房间</button>
        </div>
        <p id="mode-label">当前模式：未选择</p>
      </section>

      <section class="panel room" id="room-controls" hidden>
        <h2>房间联机</h2>
        <div id="host-controls" hidden>
          <button id="create-room">生成房间码</button>
          <p id="room-code-output"></p>
          <small>把房间码发给对方，对方输入后即可加入。</small>
        </div>
        <div id="join-controls" hidden>
          <label for="room-code-input">输入房间码：</label>
          <input id="room-code-input" maxlength="6" placeholder="例如 A1B2C3" />
          <button id="join-room">加入</button>
          <p id="join-status"></p>
        </div>
      </section>

      <section class="panel game-info">
        <p id="status">请先选择模式开始。</p>
        <div class="buttons">
          <button id="pass">停一手</button>
          <button id="restart">重新开始</button>
        </div>
      </section>

      <section class="board-wrap">
        <canvas id="board" width="760" height="760" aria-label="围棋棋盘"></canvas>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
